# Shared Qodana CI workflow for maxi-tools repos.
# Source of truth: maxi-config/.github/workflows/qodana.yml

name: Qodana

on:
  workflow_dispatch:
  schedule:
    # Off-hours full scan. PRs get the fast qodana sentinel below.
    - cron: '17 7 * * *'
  push:
    branches: [master, main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'qodana.yaml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'qodana.yaml'

concurrency:
  group: qodana-${{ github.repository }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'interactive' }}
  cancel-in-progress: true

permissions: {}

env:
  RUSTROVER_HOME: /Applications/RustRover.app/Contents
  JAVA_HOME: /Applications/RustRover.app/Contents/jbr/Contents/Home

jobs:
  qodana:
    # Keep the required PR check cheap. The RustRover scan is in qodana-full.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Qodana config (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f qodana.yaml ]; then
            test -s qodana.yaml
          else
            echo "qodana.yaml not found; skipping config validation."
          fi

      - name: Validate Qodana config (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Test-Path qodana.yaml) {
            if ((Get-Item qodana.yaml).Length -eq 0) { throw "qodana.yaml is empty" }
          } else {
            Write-Host "qodana.yaml not found; skipping config validation."
          }

      - name: Defer full scan
        run: echo "Full Qodana/RustRover scan runs nightly or via workflow_dispatch."

  qodana-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ram16]
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_852821425 }}
    steps:
      - name: Setup PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Ensure RustRover is installed
        run: |
          if [ ! -x "$RUSTROVER_HOME/MacOS/rustrover" ]; then
            echo "RustRover not found at $RUSTROVER_HOME; installing via Homebrew cask"
            brew install --cask rustrover
          fi
          test -x "$RUSTROVER_HOME/MacOS/rustrover"

      - name: Cleanup stale RustRover
        run: |
          pkill -9 -f RustRover || true
          pkill -9 -f rustrover || true

      - name: Generate org repo token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: maxi-tools

      - name: Configure git for private deps
        # Write the App-token git config under RUNNER_TEMP and remove it in the
        # always() cleanup step so credentials do not persist on the runner.
        run: |
          mkdir -p "$RUNNER_TEMP/qodana"
          cat > "$RUNNER_TEMP/qodana/.gitconfig-ci" <<GITEOF
          [credential]
          helper =
          [url "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/"]
          insteadOf = "https://github.com/"
          insteadOf = "git@github.com:"
          GITEOF

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        continue-on-error: true
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/qodana/.gitconfig-ci
          CARGO_TARGET_DIR: ${{ runner.temp }}/qodana/target
          CARGO_HOME: ${{ runner.temp }}/qodana/cargo
        run: |
          set -uo pipefail
          RESULTS_DIR="$RUNNER_TEMP/qodana/results"
          mkdir -p "$RESULTS_DIR"
          run_inspect() {
            "$RUSTROVER_HOME/MacOS/rustrover" inspect "$(pwd)" "$RESULTS_DIR" --qodana -v2 &
            local pid=$!
            ( sleep 540; kill -9 "$pid" 2>/dev/null ) &
            local watcher=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$watcher" 2>/dev/null || true
            return $rc
          }
          if ! run_inspect; then
            echo "::warning::rustrover inspect hung/failed; clearing RustRover caches and retrying cold"
            pkill -9 -f rustrover || true
            rm -rf "$HOME"/Library/Caches/JetBrains/RustRover*/caches || true
            run_inspect || echo "::warning::qodana inspect failed again after cache reset (non-fatal)"
          fi

      - name: Check Qodana results
        id: qodana_results
        if: always()
        run: |
          RESULTS_DIR="$RUNNER_TEMP/qodana/results"
          if [ -f "$RESULTS_DIR/result-allProblems.json" ] || [ -f "$RESULTS_DIR/results-allProblems.json" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$RESULTS_DIR/qodana.sarif.json" ]; then
            echo "has_sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sarif=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Qodana Cloud
        if: always() && steps.qodana_results.outputs.has_results == 'true' && env.QODANA_TOKEN != ''
        run: |
          if [ -z "${QODANA_TOKEN:-}" ]; then
            echo "QODANA_TOKEN is not set; skipping cloud upload"
            exit 0
          fi
          command -v qodana || brew install jetbrains/utils/qodana
          qodana send \
            --results-dir "$RUNNER_TEMP/qodana/results" \
            --project-dir "$(pwd)" || echo "Cloud upload failed (non-fatal)"

      - name: Upload SARIF to GitHub
        if: always() && steps.qodana_results.outputs.has_sarif == 'true'
        uses: github/codeql-action/upload-sarif@e8e8e51caba890f74f97e228d00b0b81b666ee4c # v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results
        continue-on-error: true

      - name: Cleanup CI gitconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/qodana/.gitconfig-ci"
